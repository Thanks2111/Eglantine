name: repack
on:
  push:
    branches: [lichii-bruno]
    paths: [".github/workflows/repack.yml"]
permissions:
  contents: write
  actions: read
jobs:
  repack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: lichii-windows-x86_64-pgo-52683de700157e0ebe35f75958c64bea20e58189
          path: Lichii-Bruno-Zen3
          run-id: 42380518041
          github-token: ${{ github.token }}
      - name: Zip and attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls Lichii-Bruno-Zen3 | head -50
          test -f Lichii-Bruno-Zen3/lichii.exe
          printf '@echo off\r\nset "EDEN_NX2_SWAP_INTERVAL=2"\r\ncd /d "%%~dp0"\r\nstart "" /high "%%~dp0lichii.exe"\r\n' > Lichii-Bruno-Zen3/ZELDA-30FPS.bat
          printf '@echo off\r\ncd /d "%%~dp0"\r\nstart "" /high "%%~dp0lichii.exe"\r\n' > Lichii-Bruno-Zen3/LICHII-SEM-TRAVA.bat
          zip -qr lichii-bruno-zen3-pgo-windows.zip Lichii-Bruno-Zen3
          ls -la lichii-bruno-zen3-pgo-windows.zip
          for a in $(gh release view lichii-bruno-18 --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            gh release delete-asset lichii-bruno-18 "$a" --repo "$GITHUB_REPOSITORY" -y
          done
          gh release upload lichii-bruno-18 lichii-bruno-zen3-pgo-windows.zip --repo "$GITHUB_REPOSITORY" --clobber
